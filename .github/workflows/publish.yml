name: Publish

# The 3D models' site (a copy of Awesome News, 16 November 2026, on its way to being the 3D models' own home).
# Builds the pages from this repo. No news (Ash: "The new sites don't need news"), so no keys and no scheduled jobs:
# it runs on every push to main, or by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the pages
        run: python3 build.py _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
